name: Build assistant panel dylib

on:
  # dylib 与 game.love 版本解耦：只在 trainer 面板相关代码改动时才重建，
  # 不跟 game.love 的 tag 走。需要手动重建时用 workflow_dispatch（可指定面板版本号）。
  push:
    branches:
      - main
    paths:
      - 'assistant/**'
      - 'trainer_backend.lua'
      - 'tools/sync_backend.py'
  workflow_dispatch:
    inputs:
      version:
        description: '面板版本号（留空则自动用 panel-<短哈希>）'
        required: false
        default: ''
      publish:
        description: '发布到 panel-latest release（默认 false：只出 artifact，测试阶段不发 release）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# dylib 一次只跑一个构建：快速连续 push 时取消旧的，保留最新。
concurrency:
  group: slotbound-assist
  cancel-in-progress: true

jobs:
  build-dylib:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # dylib 独立版本：手动指定优先，否则用 panel-<短哈希> 标记这次构建。
      - name: Derive version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="panel-$(git rev-parse --short=8 HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # 训练器后端三份拷贝必须同步：trainer_backend.lua（唯一事实来源）
      # → assistant/dylib/sb_trainer_v2.lua → assistant/dylib/trainer_lua.h。
      # 不一致直接 fail；本地改了后端逻辑后跑 python3 tools/sync_backend.py 再提交。
      - name: Check trainer backend in sync
        run: python3 tools/sync_backend.py --check

      # 纯 Lua 后端版：不含任何内存 hook（Dobby 那段被 SB_NO_HOOK 关掉），
      # 面板只负责 UI + cheats_ui.lua / cheats_status.lua 文件桥。
      # 用在 LiveContainer / 非 JIT 环境；需要 game.love 里带 trainer_backend.lua。
      # 只产 NoJIT 一个 dylib：要 JIT 的 SlotboundTrainer.dylib 已停用
      # （游戏包内置 trainer_backend.lua 后台，不再需要内存 hook 版）。
      - name: Build SlotboundTrainer-NoJIT.dylib
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang++ -arch arm64 -dynamiclib \
            -O2 -fPIC -fobjc-arc -DSB_NO_HOOK \
            -DSB_PANEL_VERSION="\"${{ steps.version.outputs.version }}\"" \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore \
            -lc++ \
            -Iassistant/dylib/dobby \
            -o SlotboundTrainer-NoJIT.dylib \
            assistant/dylib/SlotboundTrainer.mm
          file SlotboundTrainer-NoJIT.dylib
          otool -L SlotboundTrainer-NoJIT.dylib
          ls -la SlotboundTrainer-NoJIT.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotboundTrainer-dylib
          path: |
            SlotboundTrainer-NoJIT.dylib

      # 提取器自测：BSD awk 在 C locale 下处理中文会炸（v1.3.1 那次 tag 发布翻车的原因），
      # 换成 Python 实现后在这里跑一遍固定用例，防止以后又被换回去。
      - name: Changelog extractor self-test
        run: python3 tools/changelog_notes.py --self-test

  # 发布到固定 tag panel-latest：dylib 不跟 game.love 版本走，
  # 始终从这个固定 release 下载最新 dylib（clobber 覆盖旧资产）。
  publish:
    name: Publish dylibs to release
    # 测试期默认不发：push 只产出 artifact；要发 release 用手动触发并勾 publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build-dylib
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build-dylib.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dylib artifact
        uses: actions/download-artifact@v4
        with:
          name: SlotboundTrainer-dylib

      # 固定 tag，dylib 名字不带版本号，所属版本由 release notes 里的 VERSION 标明。
      # 只发 NoJIT 一个：要 JIT 的 SlotboundTrainer.dylib 已停用。
      - name: Publish dylibs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Trainer panel dylib（版本 ${VERSION}）。dylib 与 game.love 版本解耦，仅在面板功能改动时重建。"
          gh release create "panel-latest" --title "Trainer panel dylib" --notes "$NOTES" \
            SlotboundTrainer-NoJIT.dylib 2>/dev/null \
            || gh release upload "panel-latest" \
              SlotboundTrainer-NoJIT.dylib --clobber
          gh release view "panel-latest" --json assets --jq '.assets[].name'
