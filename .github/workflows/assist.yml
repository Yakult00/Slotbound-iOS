name: Build assistant panel dylib

on:
  # 与 ios.yml 共用同一 release：打 tag 后两个 workflow 并行构建，
  # 各自把产物传到同一个 vX.Y.Z release。先建后传，建失败说明已存在，改传。
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号从 tag 派生（与 ios.yml 同一套逻辑）。
      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
            if [[ -n "$LATEST" ]]; then
              VERSION="${LATEST#v}"
            else
              VERSION="0.0.0-dev"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build SlotboundTrainer.dylib (iOS arm64)
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          # clang++ links the C++ runtime (Dobby is C++); CoreGraphics for CGPointZero
          xcrun -sdk iphoneos clang++ -arch arm64 -dynamiclib \
            -O2 -fPIC -fobjc-arc \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore \
            -lc++ \
            -Iassistant/dylib/dobby \
            -o SlotboundTrainer.dylib \
            assistant/dylib/SlotboundTrainer.mm assistant/dylib/dobby/libdobby.a
          file SlotboundTrainer.dylib
          otool -L SlotboundTrainer.dylib
          ls -la SlotboundTrainer.dylib

      # 纯 Lua 后端版：不含任何内存 hook（Dobby 那段被 SB_NO_HOOK 关掉），
      # 面板只负责 UI + cheats_ui.lua / cheats_status.lua 文件桥。
      # 用在 LiveContainer / 非 JIT 环境；需要 game.love 里带 trainer_backend.lua。
      - name: Build SlotboundTrainer-NoJIT.dylib
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang++ -arch arm64 -dynamiclib \
            -O2 -fPIC -fobjc-arc -DSB_NO_HOOK \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore \
            -lc++ \
            -Iassistant/dylib/dobby \
            -o SlotboundTrainer-NoJIT.dylib \
            assistant/dylib/SlotboundTrainer.mm
          file SlotboundTrainer-NoJIT.dylib
          otool -L SlotboundTrainer-NoJIT.dylib
          ls -la SlotboundTrainer-NoJIT.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotboundTrainer-dylib
          path: |
            SlotboundTrainer.dylib
            SlotboundTrainer-NoJIT.dylib

      # 提取器自测：BSD awk 在 C locale 下处理中文会炸（v1.3.1 那次 tag 发布翻车的原因），
      # 换成 Python 实现后在这里跑一遍固定用例，防止以后又被换回去。
      - name: Changelog extractor self-test
        run: python3 tools/changelog_notes.py --self-test

      # 只在 tag 推送时发布到同一 release。dylib 名字不带版本号，
      # 所属版本由 release 决定（安装文档里写的就是这个名字）。
      - name: Publish dylibs to release (tag only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          python3 tools/changelog_notes.py --fallback "$VERSION" CHANGELOG.md > "$NOTES"
          # 等 ios.yml 先建好 release（最多等 15 分钟），等不到就自己建。
          for i in $(seq 1 30); do
            if gh release view "v${VERSION}" >/dev/null 2>&1; then break; fi
            sleep 30
          done
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$NOTES" \
            SlotboundTrainer.dylib SlotboundTrainer-NoJIT.dylib 2>/dev/null \
            || gh release upload "v${VERSION}" \
              SlotboundTrainer.dylib SlotboundTrainer-NoJIT.dylib --clobber
          gh release view "v${VERSION}" --json assets --jq '.assets[].name'
