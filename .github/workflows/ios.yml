name: Build unsigned iOS IPA

on:
  # 打 tag 即发布：git tag v1.3.1 && git push origin v1.3.1
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 构建按 ref 区分并发：不同 tag 互不取消，同 tag 重推才取消旧的。
# （旧版用固定 group slotbound-ios，新 tag 会把旧 tag 的构建取消掉，
# 而 assist 不受影响、照常发一个只有 dylib 的 release——P1-3 的根因。）
concurrency:
  group: slotbound-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: LÖVE 11.5 iPhoneOS ARM64
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LOVE_VERSION: "11.5"
      BUNDLE_ID: com.yakult00.slotbound
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tag 必须是三段式版本号（vX.Y.Z）。两段式拦不住 v1.31 这种歧义，
      # 只有三段式能把它当缺段拦掉；历史两段式 tag 已存在、不会重推，不受影响。
      - name: Validate tag format
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "错误：tag 必须是三段式版本号，例如 v1.3.1。当前 tag：${GITHUB_REF_NAME}"
            echo "版本号一律三段式（vX.Y.Z）。"
            exit 1
          fi

      # 版本号一律从 tag 派生，不许硬编码。
      # tag 推送：v1.3.1 -> 1.3.1；手动 dispatch：取最近的 tag，取不到则用 dev。
      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
            if [[ -n "$LATEST" ]]; then
              VERSION="${LATEST#v}"
            else
              VERSION="0.0.0-dev"
            fi
          fi
          BUILD="$(echo "$VERSION" | tr -d '.')"
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            BUILD="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build $BUILD)"

      # 游戏完整性校验：用游戏自带的 release_integrity_manifest.bin
      # 对 2072 个文件逐个比对 SHA-256 + 大小；另按 tools/shim.sha256
      # 钉死垫片层（main.lua / real_main.luac / trainer_backend.lua / @bootstrap）。
      # v1.1.4 黑屏事故（git 把 13 个文件 CRLF 改成 LF）在这里就会被拦下，
      # 不再靠用户真机发现。
      - name: Verify game file integrity
        run: python3 tools/verify_integrity.py .

      - name: Package game.love from repo files
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os, zipfile
          # Files/dirs that belong in the .love (the game project in repo root).
          include = ["main.lua", "real_main.luac", "conf.lua", "icon.png",
                     "trainer_backend.lua", "release.flag", "@bootstrap", "src"]
          with zipfile.ZipFile("game.love", "w", zipfile.ZIP_DEFLATED) as z:
              for entry in include:
                  if os.path.isdir(entry):
                      for root, _, files in os.walk(entry):
                          for f in files:
                              p = os.path.join(root, f)
                              z.write(p, p)
                  else:
                      z.write(entry, entry)
          print("game.love packaged")
          PYEOF
          ls -lh game.love

      # 包内容断言：只看仓库文件不够，verify_integrity 比对的是磁盘上的文件，
      # 打包时漏了文件它拦不住。这里直接断言打出来的 game.love。
      # 数字按当前游戏版本（PC v1.0.2）：src/ 2071 个文件
      # （2069 个 manifest 条目 + release_integrity.lua + manifest 本身），
      # 总条目 2078 = 2071 + 7 个根文件
      # （main.lua / real_main.luac / conf.lua / icon.png /
      #  trainer_backend.lua / release.flag / @bootstrap）。
      # 游戏更新后数字会变，改这里。
      - name: Assert game.love contents
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import sys, zipfile
          EXPECT_TOTAL = 2078
          EXPECT_SRC = 2071
          KEY_FILES = ["main.lua", "real_main.luac", "conf.lua", "icon.png",
                       "trainer_backend.lua", "release.flag", "@bootstrap"]
          with zipfile.ZipFile("game.love") as z:
              names = z.namelist()
          total = len(names)
          src_count = sum(1 for n in names if n.startswith("src/"))
          missing = [k for k in KEY_FILES if k not in names]
          problems = []
          if total != EXPECT_TOTAL:
              problems.append(f"total entries: want {EXPECT_TOTAL}, got {total}")
          if src_count != EXPECT_SRC:
              problems.append(f"src/ entries: want {EXPECT_SRC}, got {src_count}")
          if missing:
              problems.append(f"missing key files: {', '.join(missing)}")
          if problems:
              print("FAIL: game.love contents assertion failed:")
              for p in problems:
                  print("  " + p)
              sys.exit(1)
          print(f"OK: game.love has {total} entries ({src_count} under src/), "
                f"all {len(KEY_FILES)} key files present")
          PYEOF

      - name: Validate game package
        run: |
          set -euo pipefail
          test -s game.love
          unzip -l game.love | grep -E '^(.* )(main\.lua|conf\.lua)$'
          shasum -a 256 game.love | tee game.love.sha256

      - name: Download official LÖVE iOS source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output love-ios-source.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-ios-source.zip"
          unzip -q love-ios-source.zip
          test -d "love-${LOVE_VERSION}-ios-source/platform/xcode/love.xcodeproj"

      # ---- 锁定纯横屏：编译期写进 love 二进制，等价于 SDL_IOS_ORIENTATIONS 环境变量 ----
      # 只改源码不改二进制偏移；Xcode/SDK 升级不影响；重签名后仍然生效。
      - name: Lock landscape orientation (SDL hint)
        run: |
          set -euo pipefail
          cd "love-${LOVE_VERSION}-ios-source"
          python3 - << 'PYEOF'
          import io
          p = "src/love.cpp"
          s = io.open(p, encoding="utf-8").read()
          needle = "int main(int argc, char **argv)\n{\n"
          assert s.count(needle) == 1, "main() anchor not found"
          inject = needle + (
              "#ifdef LOVE_IOS\n"
              "\t/* SlotBound: 纯横屏，必须在 SDL 建窗之前设置 */\n"
              "\tSDL_SetHintWithPriority(SDL_HINT_ORIENTATIONS, \"LandscapeLeft LandscapeRight\", SDL_HINT_OVERRIDE);\n"
              "#endif\n"
          )
          io.open(p, "w", encoding="utf-8", newline="\n").write(s.replace(needle, inject, 1))
          PYEOF
          grep -n "SDL_HINT_ORIENTATIONS" src/love.cpp
          grep -n "int main(int argc, char \*\*argv)" src/love.cpp

      - name: Build unsigned iPhoneOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "love-${LOVE_VERSION}-ios-source/platform/xcode/love.xcodeproj" \
            -target love-ios \
            -sdk iphoneos \
            -configuration Release \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            build

      - name: Fuse package and verify device binary
        run: |
          set -euo pipefail
          APP="love-${LOVE_VERSION}-ios-source/platform/xcode/build/Release-iphoneos/love.app"
          test -n "$APP"
          cp game.love "$APP/game.love"
          # ---- 正版图标：用游戏原始 App 的图标重建（LÖVE 模板默认图标必须换掉）----
          # 源图 icon.png 是仓库里的 256x256 图标，由它生成各尺寸
          sips -z 120 120 icon.png --out "$APP/iOS AppIcon60x60@2x.png" >/dev/null
          sips -z 180 180 icon.png --out "$APP/iOS AppIcon60x60@3x.png" >/dev/null
          sips -z 76  76  icon.png --out "$APP/iOS AppIcon76x76~ipad.png" >/dev/null
          sips -z 152 152 icon.png --out "$APP/iOS AppIcon76x76@2x~ipad.png" >/dev/null
          sips -z 167 167 icon.png --out "$APP/iOS AppIcon83.5x83.5@2x~ipad.png" >/dev/null
          # Assets.car 里是 LÖVE 模板的图标，留着它 iOS 会优先用旧的 → 直接删掉，
          # 并把 CFBundleIconName 去掉，让系统回落到 CFBundleIconFiles 的 PNG
          rm -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 iOS AppIcon60x60" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:0 iOS AppIcon60x60" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:1 string 'iOS AppIcon76x76'" "$APP/Info.plist" 2>/dev/null || true
          ls -l "$APP"/iOS\ AppIcon*.png
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SlotBound" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName SlotBound" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build }}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP/Info.plist" || true
          /usr/bin/xcrun vtool -show-build "$APP/love" | grep -Eq '^[[:space:]]*platform IOS$'
          /usr/bin/lipo -archs "$APP/love" | grep -qw arm64
          mkdir -p Payload
          cp -R "$APP" Payload/SlotBound.app
          /usr/bin/ditto -c -k --keepParent Payload "Slotbound-v${{ steps.version.outputs.version }}.ipa"
          unzip -t "Slotbound-v${{ steps.version.outputs.version }}.ipa"
          unzip -l "Slotbound-v${{ steps.version.outputs.version }}.ipa" | grep -E 'Payload/SlotBound.app/(game\.love|Info\.plist|love)$'
          {
            echo "bundle_id=${BUNDLE_ID}"
            echo "engine=LÖVE ${LOVE_VERSION}"
            echo "platform=iphoneos"
            echo "architecture=arm64"
            echo "signing=unsigned; re-sign required"
            echo "game_sha256=$(shasum -a 256 game.love | awk '{print $1}')"
          } > BUILD-METADATA.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slotbound-unsigned
          path: |
            Slotbound-v${{ steps.version.outputs.version }}.ipa
            BUILD-METADATA.txt
            game.love.sha256

      # 提取器自测：BSD awk 在 C locale 下处理中文会炸（v1.3.1 那次 tag 发布翻车的原因），
      # 换成 Python 实现后在这里跑一遍固定用例，防止以后又被换回去。
      - name: Changelog extractor self-test
        run: python3 tools/changelog_notes.py --self-test

  # 发布是独立 job：与 assist.yml 的 publish job 共用同一 concurrency 组，
  # 串行化对同一 release 的操作（一个先建 release，另一个再传）。
  # cancel-in-progress 必须 false——否则两个 publish job 会互相取消。
  publish:
    name: Publish IPA release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Slotbound-unsigned

      # 只在 tag 推送时发布。release 只含 IPA（.love 已包在 IPA 里，不再单独发）。
      # 与 assist.yml 共用同一 release：先建后传，建失败说明已存在，改传。
      # release notes 优先取 CHANGELOG.md 里对应版本的章节，取不到用默认文案。
      - name: Publish release (tag only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA="Slotbound-v${VERSION}.ipa"
          NOTES="$(mktemp)"
          python3 tools/changelog_notes.py --fallback "$VERSION" CHANGELOG.md > "$NOTES"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$NOTES" "$IPA" 2>/dev/null \
            || gh release upload "v${VERSION}" "$IPA" --clobber
          gh release view "v${VERSION}" --json assets --jq '.assets[].name'
